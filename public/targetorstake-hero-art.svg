<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">TargetorStake — stake and target artwork</title>
<desc id="desc">A cinematic red and gold target with a dart in the bullseye, stacked coins, and numbered balls.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#390812"/><stop offset=".48" stop-color="#12070c"/><stop offset="1" stop-color="#03060b"/></linearGradient>
  <radialGradient id="flare"><stop stop-color="#ff6b24" stop-opacity=".72"/><stop offset="1" stop-color="#d20c2c" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3ad"/><stop offset=".28" stop-color="#ffca42"/><stop offset=".62" stop-color="#b66a0b"/><stop offset=".82" stop-color="#ffe27b"/><stop offset="1" stop-color="#8e4506"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4657"/><stop offset=".5" stop-color="#b50828"/><stop offset="1" stop-color="#520719"/></linearGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe990"/><stop offset=".45" stop-color="#d9951b"/><stop offset="1" stop-color="#6b3107"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
  <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="13" cy="22" r="1.5" fill="#ffdb76" opacity=".55"/><circle cx="70" cy="64" r="1" fill="#ff6548" opacity=".65"/><path d="M35 5v7M31 8.5h8" stroke="#ffc44e" opacity=".4"/></pattern>
</defs>
