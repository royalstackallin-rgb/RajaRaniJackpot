<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Ruby Rush — Crack the Vault</title><desc id="desc">A glowing red gemstone, a black bomb, and metallic Ruby Rush lettering in a dramatic red-and-gold vault.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#180910"/><stop offset=".48" stop-color="#3a0712"/><stop offset="1" stop-color="#080d12"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ff254b" stop-opacity=".6"/><stop offset="1" stop-color="#ff254b" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff1b4"/><stop offset=".3" stop-color="#e8b54e"/><stop offset=".6" stop-color="#fff0a1"/><stop offset="1" stop-color="#8c4b12"/></linearGradient>
 <linearGradient id="silver" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#aab8c4"/><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#5a6472"/></linearGradient>
 <linearGradient id="ruby" x2=".9" y2="1"><stop stop-color="#ffecff"/><stop offset=".23" stop-color="#ff668f"/><stop offset=".55" stop-color="#f00043"/><stop offset="1" stop-color="#71001f"/></linearGradient>
 <radialGradient id="bomb"><stop stop-color="#41414b"/><stop offset=".7" stop-color="#17151c"/><stop offset="1" stop-color="#050509"/></radialGradient>
 <filter id="shine" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="500" fill="url(#bg)"/><rect width="1200" height="500" fill="url(#glow)"/>
<g opacity=".7" fill="none" stroke="#ff234c"><path d="M0 65H1200M0 82H1200M0 420H1200M35 0V500M1165 0V500" stroke-width="2"/><path d="M80 0L170 500M1120 0L1030 500" opacity=".3"/></g>
<g opacity=".55" fill="none" stroke="#a66a31" stroke-width="7"><circle cx="600" cy="245" r="210"/><circle cx="600" cy="245" r="180" stroke-width="3"/><circle cx="600" cy="245" r="145" stroke-width="2"/><path d="M600 40V125M600 365V450M395 245H480M720 245H805M455 100L515 160M685 330L745 390M745 100L685 160M515 330L455 390"/></g>
<g transform="translate(115 250)" filter="url(#shine)"><path d="M-105 -70L-40 -105L42 -98L105 -65L80 18L0 105L-80 20Z" fill="url(#ruby)" stroke="#ff9bc1" stroke-width="4"/><path d="M-105 -70L-40 -105L-25 -35L-80 20Z" fill="#ffecff" opacity=".8"/><path d="M-40 -105L42 -98L-25 -35Z" fill="#ff4b8a"/><path d="M42 -98L105 -65L25 -35Z" fill="#f60045"/><path d="M-80 20L-25 -35L0 105Z" fill="#ff1c61"/><path d="M25 -35L80 18L0 105Z" fill="#a90039"/><path d="M-25 -35L25 -35L0 105Z" fill="#fff0f7"/></g>
<g transform="translate(1080 265)"><path d="M-18 -91L-8 -126L25 -133L44 -108L34 -78" fill="none" stroke="#c7a16a" stroke-width="17" stroke-linecap="round"/><path d="M-18 -91L-8 -126L25 -133L44 -108L34 -78" fill="none" stroke="#27232a" stroke-width="9" stroke-linecap="round"/><circle cx="42" cy="-145" r="24" fill="#ffba44" opacity=".3" filter="url(#shine)"/><path d="M42 -177L48 -154L68 -164L57 -146L78 -137L54 -133L61 -110L43 -126L28 -108L31 -132L8 -139L31 -147L24 -168L41 -155Z" fill="#ffd879" filter="url(#shine)"/><circle cy="0" r="91" fill="url(#bomb)" stroke="#7e2739" stroke-width="5"/><circle cy="0" r="70" fill="none" stroke="#ff234d" stroke-width="4" opacity=".8"/><path d="M-47 -19Q0 -67 47 -19L39 24Q0 63 -39 24Z" fill="#f41b42"/><path d="M-29 -5L-7 10L-30 25ZM29 -5L7 10L30 25Z" fill="#171017"/><path d="M-18 38Q0 23 18 38Q0 54 -18 38Z" fill="#170a10"/></g>
<g text-anchor="middle" filter="url(#shadow)"><text x="600" y="210" font-family="Georgia,serif" font-weight="900" font-size="88" letter-spacing="2" fill="url(#silver)" stroke="#25110e" stroke-width="10" paint-order="stroke">RUBY</text><text x="600" y="302" font-family="Georgia,serif" font-weight="900" font-size="100" letter-spacing="3" fill="url(#ruby)" stroke="url(#gold)" stroke-width="4" paint-order="stroke">RUSH</text><text x="600" y="354" font-family="Arial,sans-serif" font-weight="900" font-size="24" letter-spacing="10" fill="url(#gold)">CRACK THE VAULT</text></g>
